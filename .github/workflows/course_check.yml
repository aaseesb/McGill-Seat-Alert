name: Check Course Availability

on:
  schedule:
    - cron: '17 * * * *'  # Runs hourly at :17 (off the busy top of the hour)
  workflow_dispatch:  # Allows manual triggering
    inputs:
      test_email:
        description: 'Send a test alert instead of checking seats'
        type: boolean
        default: false
      notify:
        description: 'How to alert for this run (default follows config.json / ALERT_METHOD)'
        type: choice
        options:
          - default
          - push
          - email
          - both
        default: default

jobs:
  check-courses:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Run course check script
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          # Optional: without these the step fails on purpose when a seat opens,
          # and GitHub emails you about the failed run instead.
          # ALERT_EMAIL can hold several addresses separated by commas.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          # Phone push notifications via the free ntfy app (comma-separate several topics)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional override of "notify" in config.json: email, push, or both
          ALERT_METHOD: ${{ vars.ALERT_METHOD }}
          # Dropdown from a manual run; empty on scheduled runs
          NOTIFY_INPUT: ${{ inputs.notify }}
        run: |
          args=()
          if [ -n "$NOTIFY_INPUT" ] && [ "$NOTIFY_INPUT" != "default" ]; then
            args+=(--notify "$NOTIFY_INPUT")
          fi
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python register.py --test-email "${args[@]}"
          else
            python register.py --fail-on-available "${args[@]}"
          fi
